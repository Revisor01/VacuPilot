name: Report a bug
description: Something does not work as expected.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, server
        addresses or account names; this issue is public. Report security
        issues as described in SECURITY.md.
  - type: textarea
    id: observation
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of the app
      placeholder: "e.g. 1.1.3 (build 108)"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Robot and firmware
      placeholder: "e.g. Dreame L10s Ultra, Valetudo 2025.10.0"
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "e.g. iPhone 16, iOS 26.1"
