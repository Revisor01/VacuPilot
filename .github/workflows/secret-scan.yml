name: Secret-Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: Revisor01/workflows/.github/workflows/secret-scan.yml@20bd05cfcd9ba14fcc96912d0830ddf1d260252f # 1.5.2
    secrets:
      GITLEAKS_EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}
