name: Tests

# Unit-Tests bei jedem PR, mit den Simulator-Signiereinstellungen des Projekts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: Revisor01/workflows/.github/workflows/xcode-tests.yml@20bd05cfcd9ba14fcc96912d0830ddf1d260252f # 1.5.2
    with:
      projekt: ValetudoApp/ValetudoApp.xcodeproj
      schema: ValetudoApp
      test-ziel: ValetudoAppTests
