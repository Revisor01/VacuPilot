name: Tests

# Unit-Tests bei jedem PR auf einem Simulator, damit die Pflicht "Checks grün
# vor dem Merge" sie erfasst. Signiert wird mit den Simulator-Einstellungen des
# Projekts (ad hoc), so prüft der Check auch die lokale Konfiguration.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: Revisor01/workflows/.github/workflows/xcode-tests.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      projekt: ValetudoApp/ValetudoApp.xcodeproj
      schema: ValetudoApp
      test-ziel: ValetudoAppTests
