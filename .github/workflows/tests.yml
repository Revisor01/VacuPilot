name: Tests

# Unit-Tests bei jedem PR, mit den Simulator-Signiereinstellungen des Projekts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: Revisor01/workflows/.github/workflows/xcode-tests.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      projekt: ValetudoApp/ValetudoApp.xcodeproj
      schema: ValetudoApp
      test-ziel: ValetudoAppTests
