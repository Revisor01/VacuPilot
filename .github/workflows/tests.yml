name: Tests

# Unit-Tests bei jedem PR, mit den Simulator-Signiereinstellungen des Projekts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: Revisor01/workflows/.github/workflows/xcode-tests.yml@3ec878449b89e1a69714b87381cb8effd7075fef # 1.5.1
    with:
      projekt: ValetudoApp/ValetudoApp.xcodeproj
      schema: ValetudoApp
      test-ziel: ValetudoAppTests
