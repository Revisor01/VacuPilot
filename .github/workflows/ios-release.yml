name: iOS Release Build

# Baut das Release in Xcode Cloud (Workflow „VacuPilot TestFlight“) und wartet
# darauf; der Build landet in TestFlight und kann von dort in den App Store.
# Xcode Cloud signiert selbst und vergibt die Build-Nummer. Die Workflow-ID
# steht in der Repo-Variable XCODE_CLOUD_WORKFLOW.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    uses: Revisor01/workflows/.github/workflows/xcode-cloud.yml@af94834b59cc0a1f5155e40c36219fd75c38e8c2 # 1.3.0
    with:
      workflow-id: ${{ vars.XCODE_CLOUD_WORKFLOW }}
    secrets:
      asc-key-id: ${{ secrets.ASC_KEY_ID }}
      asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
      asc-key-p8: ${{ secrets.ASC_KEY_P8_BASE64 }}
